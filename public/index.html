<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f7">
<link rel="manifest" href="/manifest.json">
<title>PFC Camera</title>
<style>
body{margin:0;background:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111}
.app{max-width:560px;margin:auto;padding:16px 14px 100px}.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0}
h1{margin:0 0 4px}.sub,.note,.meta,.label{color:#707070}.label,.note,.meta{font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
input,select,button{width:100%;box-sizing:border-box;border-radius:12px;padding:12px;font-size:16px}
input,select{border:1px solid #e5e5ea;background:#fff}button{border:0;background:#111;color:#fff;font-weight:700}
.secondary{background:#ececf0;color:#111}.danger{background:#fbe8e8;color:#9f1d1d;width:auto}
.row{display:flex;gap:10px;align-items:center}.photo{width:100%;max-height:280px;object-fit:contain;border-radius:14px;background:#eee;display:none;margin-top:10px}
.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{background:#f7f7f8;border-radius:14px;padding:10px}
.big{font-size:30px;font-weight:700}.food{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #eee}
.hint{display:none;margin-top:8px;padding:10px;background:#fff8e8;border-radius:12px;font-size:13px}
.sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(245,245,247,.94);padding:10px 14px}.sticky>div{max-width:560px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>
<div class="app">
<h1>PFC Camera</h1><div class="sub">撮る → 確認 → 登録</div>

<div class="card">
<div class="label">今日の摂取カロリー</div><div><span class="big" id="calNow">0</span> / <span id="goalCalText">2000</span> kcal</div>
<div class="macro" style="margin-top:12px">
<div class="box">P <b id="pNow">0</b>g<div class="label" id="pRemain"></div></div>
<div class="box">F <b id="fNow">0</b>g<div class="label" id="fRemain"></div></div>
<div class="box">C <b id="cNow">0</b>g<div class="label" id="cRemain"></div></div>
</div></div>

<div class="card" id="scan">
<h2>食品を追加</h2>
<input id="cameraInput" type="file" accept="image/*" capture="environment">
<img id="preview" class="photo">
<div class="row" style="margin-top:10px"><button id="analyzeBtn">AIで読み取る</button><button class="secondary" id="demoBtn">デモ</button></div>
<p class="note">商品名が写真に写っていない場合は推測せず空欄にします。</p>
</div>

<div class="card">
<h2>読み取り結果</h2>
<div class="label">商品名</div><input id="name" placeholder="画像に商品名がなければ手入力">
<div id="nameHint" class="hint">商品名は画像から確認できませんでした。手入力してください。</div>
<div style="margin-top:12px"><div class="label">過去に登録した食品</div><select id="historySelect"><option value="">選択してください</option></select></div>
<div class="grid2" style="margin-top:10px">
<div><div class="label">基準量</div><input id="baseAmount" type="number" value="100" step="0.1"></div>
<div><div class="label">単位</div><select id="unit"><option>g</option><option>ml</option><option>個</option><option>袋</option><option>食</option></select></div>
</div>
<div class="grid2" style="margin-top:10px">
<div><div class="label">kcal</div><input id="kcal" type="number" step="0.1"></div>
<div><div class="label">食塩相当量 g</div><input id="salt" type="number" step="0.01"></div>
</div>
<div class="grid3" style="margin-top:10px">
<div><div class="label">P g</div><input id="protein" type="number" step="0.1"></div>
<div><div class="label">F g</div><input id="fat" type="number" step="0.1"></div>
<div><div class="label">C g</div><input id="carbs" type="number" step="0.1"></div>
</div>
<div class="grid2" style="margin-top:10px">
<div><div class="label">食べた量</div><input id="eatenAmount" type="number" value="100" step="0.1"></div>
<div><div class="label">食事</div><select id="meal"><option>朝食</option><option>昼食</option><option>夕食</option><option>間食</option></select></div>
</div>
<div id="scaled" style="margin-top:12px;padding:12px;background:#f7f7f8;border-radius:12px">P 0g / F 0g / C 0g / 0kcal</div>
<button id="saveFood" style="margin-top:12px">今日の食事に登録</button>
</div>

<div class="card"><h2>今日の食事</h2><div id="foods"></div></div>

<div class="card">
<h2>目標設定</h2>
<div class="grid2">
<div><div class="label">kcal</div><input id="goalKcal" type="number" value="2000"></div>
<div><div class="label">P g</div><input id="goalP" type="number" value="130"></div>
<div><div class="label">F g</div><input id="goalF" type="number" value="60"></div>
<div><div class="label">C g</div><input id="goalC" type="number" value="250"></div>
</div><button id="saveGoals" class="secondary" style="margin-top:12px">目標を保存</button>
</div>
</div>

<div class="sticky"><div><button onclick="cameraInput.click()">📷 撮影</button><button class="secondary" onclick="scan.scrollIntoView({behavior:'smooth'})">＋ 食品追加</button></div></div>

<script>
const $=id=>document.getElementById(id), num=id=>parseFloat($(id).value)||0, r1=v=>Math.round(v*10)/10;
const dateKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const key=dateKey();
let foodItems=JSON.parse(localStorage.getItem('pfc_foods_'+key)||'[]');
let history=JSON.parse(localStorage.getItem('pfc_history')||'[]');
let goals=JSON.parse(localStorage.getItem('pfc_goals')||'{"kcal":2000,"p":130,"f":60,"c":250}');

function ratio(){return num('baseAmount')?num('eatenAmount')/num('baseAmount'):0}
function updateScaled(){const x=ratio();$('scaled').textContent=`P ${r1(num('protein')*x)}g / F ${r1(num('fat')*x)}g / C ${r1(num('carbs')*x)}g / ${r1(num('kcal')*x)}kcal`}
['baseAmount','eatenAmount','protein','fat','carbs','kcal'].forEach(i=>$(i).addEventListener('input',updateScaled));

cameraInput.onchange=e=>{
  const f=e.target.files?.[0];
  if(f){preview.src=URL.createObjectURL(f);preview.style.display='block'}
};

demoBtn.onclick=()=>{name.value='フルグラ';baseAmount.value=50;unit.value='g';kcal.value=222;protein.value=3.6;fat.value=8;carbs.value=36.1;salt.value=.2;eatenAmount.value=50;updateScaled()};

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(reader.error||new Error('画像の読み込みに失敗しました'));
    reader.readAsDataURL(file);
  });
}

analyzeBtn.onclick=async()=>{
 const f=cameraInput.files?.[0];
 if(!f)return alert('栄養成分表示を撮影してください');
 analyzeBtn.disabled=true;analyzeBtn.textContent='読み取り中…';
 try{
   const image=await fileToDataURL(f);
   const res=await fetch('/api/analyze',{
     method:'POST',
     headers:{'Content-Type':'application/json'},
     body:JSON.stringify({image})
   });
   const raw=await res.text();
   if(!res.ok)throw new Error(raw||`HTTP ${res.status}`);
   const d=JSON.parse(raw);
   name.value=d.food_name||'';nameHint.style.display=d.food_name?'none':'block';
   baseAmount.value=d.serving_size||100;
   if([...unit.options].some(o=>o.value===d.serving_unit))unit.value=d.serving_unit;
   kcal.value=d.calories??'';protein.value=d.protein??'';fat.value=d.fat??'';carbs.value=d.carbohydrates??'';salt.value=d.salt??'';
   eatenAmount.value=d.serving_size||100;updateScaled();
 }catch(e){
   alert('AI読み取りに失敗しました。\\n\\n'+e.message)
 }finally{
   analyzeBtn.disabled=false;analyzeBtn.textContent='AIで読み取る'
 }
};

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderHistory(){historySelect.innerHTML='<option value="">選択してください</option>'+history.map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`).join('')}
historySelect.onchange=()=>{const i=parseInt(historySelect.value);if(Number.isNaN(i))return;const x=history[i];name.value=x.name;baseAmount.value=x.base;unit.value=x.unit;kcal.value=x.kcal;protein.value=x.p;fat.value=x.f;carbs.value=x.c;salt.value=x.salt;eatenAmount.value=x.base;nameHint.style.display='none';updateScaled()};

function saveHistory(){const nm=name.value.trim();if(!nm)return;const x={name:nm,base:num('baseAmount'),unit:unit.value,kcal:num('kcal'),p:num('protein'),f:num('fat'),c:num('carbs'),salt:num('salt')};history=history.filter(h=>h.name.toLowerCase()!=nm.toLowerCase());history.unshift(x);history=history.slice(0,50);localStorage.setItem('pfc_history',JSON.stringify(history));renderHistory()}
function resetEntry(){['name','kcal','protein','fat','carbs','salt'].forEach(i=>$(i).value='');baseAmount.value=100;eatenAmount.value=100;unit.value='g';cameraInput.value='';preview.style.display='none';preview.src='';historySelect.value='';nameHint.style.display='none';updateScaled()}
saveFood.onclick=()=>{const x=ratio();foodItems.push({id:Date.now(),name:name.value.trim()||'名称未設定',meal:meal.value,amount:num('eatenAmount'),unit:unit.value,kcal:r1(num('kcal')*x),p:r1(num('protein')*x),f:r1(num('fat')*x),c:r1(num('carbs')*x)});localStorage.setItem('pfc_foods_'+key,JSON.stringify(foodItems));saveHistory();render();resetEntry()};
function removeFood(id){foodItems=foodItems.filter(x=>x.id!==id);localStorage.setItem('pfc_foods_'+key,JSON.stringify(foodItems));render()}

function render(){
 const t=foodItems.reduce((a,x)=>({k:a.k+x.kcal,p:a.p+x.p,f:a.f+x.f,c:a.c+x.c}),{k:0,p:0,f:0,c:0});
 calNow.textContent=r1(t.k);pNow.textContent=r1(t.p);fNow.textContent=r1(t.f);cNow.textContent=r1(t.c);goalCalText.textContent=goals.kcal;
 pRemain.textContent='残り '+r1(Math.max(0,goals.p-t.p))+'g';fRemain.textContent='残り '+r1(Math.max(0,goals.f-t.f))+'g';cRemain.textContent='残り '+r1(Math.max(0,goals.c-t.c))+'g';
 $('foods').innerHTML=foodItems.length?foodItems.slice().reverse().map(x=>`<div class="food"><div><b>${esc(x.name)}</b><div class="meta">${x.meal}・${x.amount}${x.unit}・${x.kcal}kcal</div><div class="meta">P ${x.p}g / F ${x.f}g / C ${x.c}g</div></div><button class="danger" onclick="removeFood(${x.id})">削除</button></div>`).join(''):'<div class="note">まだ登録がありません。</div>'
}
saveGoals.onclick=()=>{goals={kcal:num('goalKcal'),p:num('goalP'),f:num('goalF'),c:num('goalC')};localStorage.setItem('pfc_goals',JSON.stringify(goals));render()};
goalKcal.value=goals.kcal;goalP.value=goals.p;goalF.value=goals.f;goalC.value=goals.c;renderHistory();updateScaled();render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body></html>
